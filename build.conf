# build.conf — sourced by build.sh (plain bash)

# --- Paths ------------------------------------------------------------
ROOT=/Users/oz/Documents/Obsidian/ozpoo.github.io     # css/js/font live here
SOURCE=/Users/oz/Documents/Obsidian/edu/Research      # markdown sections live here
INDEX_DIR="$ROOT/"                                    # contains index.md (include:: paths resolve from here)
OUT="$ROOT/site"                                      # `build` output
DEV_OUT="$ROOT/.dev"                                  # `dev` output (add .dev to .gitignore)
DEV_PORT=8000

# --- Site chrome ------------------------------------------------------
SITE_TAGLINE="Made with code."
FOOTER_TEXT="Still figuring it out."

# --- Performance ------------------------------------------------------
# Parallel pandoc workers (override per run with -j N)
JOBS=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)

# --- Pandoc -----------------------------------------------------------
PANDOC_FROM="markdown-auto_identifiers+mark+hard_line_breaks"

# --- Static assets (relative to ROOT) ---------------------------------
ASSETS=(reset.css font.css typography.css style.css script.js)
ASSET_DIRS=(font)

# --- Sections ---------------------------------------------------------
# "output-prefix|folder under SOURCE|nav label"
# Leave the nav label empty to build the section but keep it out of the nav.
# Nav order follows this list. Each folder builds its top-level *.md only
# (list.md is skipped), so nested folders need their own entry.
SECTIONS=(
  "the-foundations|The Foundations|"
  "a-way-in|A Way In|A Way In"
  "field-notes|Field Notes|Field Notes"
  "working-inquiries|Working Inquiries|Working Inquiries"
  "practices|Practices|Practices"
  "practices-information-as-a-system|Practices/Information as a System|"
  "practices-ai-for-design-thinking|Practices/AI For Design Thinking|"
  "frameworks|Frameworks|Frameworks"
)